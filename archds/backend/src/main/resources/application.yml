server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: archds-backend
  jackson:
    serialization:
      write-dates-as-timestamps: false
    property-naming-strategy: SNAKE_CASE
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-min-32-chars-long-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-ms: ${AI_TIMEOUT_MS:180000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:archds;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/architecture_db}
    username: ${DB_USERNAME:architecture_user}
    password: ${DB_PASSWORD:host}
    driver-class-name: org.postgresql.Driver
