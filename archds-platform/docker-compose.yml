services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archds}
      POSTGRES_USER: ${POSTGRES_USER:-archds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archds_dev_password}
    ports: ["5432:5432"]
    volumes: ["archds-pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-archds} -d ${POSTGRES_DB:-archds}"]
      interval: 5s
      timeout: 5s
      retries: 12
  ai-service:
    build: ./ai-service
    ports: ["8000:8000"]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      ENABLE_SEMANTIC_RETRIEVAL: ${ENABLE_SEMANTIC_RETRIEVAL:-false}
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    depends_on:
      postgres: {condition: service_healthy}
      ai-service: {condition: service_healthy}
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/archds
      DB_USERNAME: ${POSTGRES_USER:-archds}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-archds_dev_password}
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-random-secret-at-least-32-chars}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    healthcheck:
      test: ["CMD-SHELL","curl -fsS http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    depends_on:
      backend: {condition: service_healthy}
    ports: ["3000:80"]
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  archds-pg-data:
